<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Today's Bets · DG</title>
    <link rel="stylesheet" href="/static/style.css?v=14" />
    <link rel="stylesheet" href="/static/bets.css?v=2" />
    <script src="/static/table_tools.js?v=6" defer></script>
  </head>
  <body>
    <main class="container">
      {% set nav_current = "todays-bets" %}
      {% include "includes/app_nav.html" %}

      <header class="app-hero">
        <h1 class="app-brand">Today's <span>Bets</span></h1>
        <p class="subtitle">Open and settled positions across all strategies for today's slate.</p>
      </header>

      <div class="bets-kpis" aria-label="Today summary">
        <div class="bets-kpi">
          <p class="bets-kpi__label">Open</p>
          <p class="bets-kpi__value" id="kpiOpen">0</p>
        </div>
        <div class="bets-kpi">
          <p class="bets-kpi__label">Pending</p>
          <p class="bets-kpi__value" id="kpiPending">0</p>
        </div>
        <div class="bets-kpi">
          <p class="bets-kpi__label">Open stake</p>
          <p class="bets-kpi__value" id="kpiStake">0₹</p>
        </div>
      </div>

      <div class="bets-toolbar">
        <label>
          Strategy
          <select id="strategyFilter" aria-label="Filter by strategy">
            <option value="">All strategies</option>
          </select>
        </label>
        <button type="button" id="resyncToday" class="btn-secondary" title="Rebuild today's open bets from the latest slate, keeping settled history">
          Resync today
        </button>
        <span id="resyncStatus" class="bets-resync-status" role="status" aria-live="polite"></span>
      </div>

      <div id="betsRoot"></div>
    </main>
    <script>
      window.INITIAL_TODAYS_BETS = {{ payload | tojson }};
    </script>
    <script src="/static/todays_bets.js?v=3" defer></script>
  </body>
</html>
