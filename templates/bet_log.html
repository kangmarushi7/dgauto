<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bet Log · DG</title>
    <link rel="stylesheet" href="/static/style.css?v=14" />
    <link rel="stylesheet" href="/static/bets.css?v=4" />
    <script src="/static/table_tools.js?v=6" defer></script>
  </head>
  <body>
    <main class="container">
      {% set nav_current = "bet-log" %}
      {% include "includes/app_nav.html" %}

      <header class="app-hero">
        <h1 class="app-brand">Bet <span>Log</span></h1>
        <p class="subtitle">Open and settled bets across LM, NO, H2H, +EV, CS, Prop, and Recommended.</p>
      </header>

      <div id="rangePill" class="bets-summary-pill" aria-live="polite"></div>

      <div class="bets-toolbar">
        <label>
          Strategy
          <select id="strategyFilter" aria-label="Filter by strategy">
            <option value="">All strategies</option>
          </select>
        </label>
        <label>
          Result
          <select id="resultFilter" aria-label="Filter by result">
            <option value="">All results</option>
            <option value="open">Open</option>
            <option value="pending">Pending</option>
            <option value="won">Win</option>
            <option value="lost">Loss</option>
            <option value="push">Push</option>
          </select>
        </label>
        <div class="bets-range" id="rangePicker">
          <span class="bets-range__label">Range</span>
          <button type="button" class="bets-range__trigger" id="rangeTrigger" aria-haspopup="dialog" aria-expanded="false">
            <span id="rangeTriggerText">Last 30 days</span>
            <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
              <path fill="currentColor" d="M4.5 2v1H3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1h-1.5V2h-1v1h-5V2h-1zm8.5 4H3v7h10V6z"/>
            </svg>
          </button>
          <div class="bets-range__popover" id="rangePopover" hidden role="dialog" aria-label="Pick date range">
            <div class="bets-range__presets" role="group" aria-label="Quick ranges">
              <button type="button" data-preset="7">7d</button>
              <button type="button" data-preset="30">30d</button>
              <button type="button" data-preset="90">90d</button>
              <button type="button" data-preset="all">All</button>
            </div>
            <div class="bets-cal__nav">
              <button type="button" class="bets-cal__nav-btn" id="calPrev" aria-label="Previous month">‹</button>
              <div class="bets-cal__month" id="calMonthLabel"></div>
              <button type="button" class="bets-cal__nav-btn" id="calNext" aria-label="Next month">›</button>
            </div>
            <div class="bets-cal__weekdays" aria-hidden="true">
              <span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
            </div>
            <div class="bets-cal__grid" id="calGrid" role="grid"></div>
            <p class="bets-cal__hint" id="calHint">Click a day, or click two days for a range.</p>
            <div class="bets-cal__actions">
              <button type="button" class="btn-secondary" id="calClear">Clear</button>
              <button type="button" id="calApply">Apply</button>
            </div>
          </div>
        </div>
      </div>

      <div id="betsRoot"></div>
      <div class="bets-pager" id="pager" hidden>
        <span class="bets-pager__meta" id="pagerMeta"></span>
        <div>
          <button type="button" class="btn-secondary" id="prevPage">Previous</button>
          <button type="button" class="btn-secondary" id="nextPage">Next</button>
        </div>
      </div>
    </main>
    <script>
      window.INITIAL_BET_LOG = {{ payload | tojson }};
    </script>
    <script src="/static/unified_bet_log.js?v=6" defer></script>
  </body>
</html>
